[project]
name = "sap-po-web"
version = "0.1.0"
description = "SAP S/4HANA 표준 구매오더 API(OData V4)를 Python 웹 화면으로 보는 데모"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.40",
    "truststore>=0.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
